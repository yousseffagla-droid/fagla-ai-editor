<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FAGLA AI Editor</title><link rel="stylesheet" href="styles.css"></head><body><header><div class="brand">FAGLA <span>AI EDITOR</span></div><button id="themeBtn">☾</button><button id="exportBtn" class="primary">تصدير الفيديو</button></header><main><aside><h2>المونتاج الذكي</h2><label class="upload"><input id="videoInput" type="file" accept="video/*"><b>＋ ارفع فيديو</b><small>MP4 / MOV / WebM</small></label><div class="field"><label>ستايل المونتاج</label><select id="style"><option value="social">Fast Social</option><option value="clean">Clean & Professional</option><option value="cinematic">Cinematic</option></select></div><div class="field"><label>الخلفية</label><select id="bgMode"><option value="original">الأصلية</option><option value="blur">Blur احترافي</option></select></div><div class="checks"><label><input id="cutSilence" type="checkbox" checked> قص السكوت تلقائيًا</label><label><input id="smartZoom" type="checkbox" checked> Smart Zoom</label><label><input id="captions" type="checkbox" checked> ترجمة عربية</label><label><input id="audioFix" type="checkbox" checked> تحسين الصوت</label></div><button id="autoBtn" class="primary wide">✨ ابدأ AI Auto Edit</button><div id="status" class="status">جاهز</div></aside><section><div class="top"><div><h1>AI Video Workspace</h1><p id="fileName">ارفع فيديو وخلّي النظام يجهز المونتاج</p></div><div class="score"><b id="score">—</b><span>AI Score</span></div></div><div class="preview"><div id="emptyPreview">🎬<br><span>الفيديو هيظهر هنا</span></div><video id="preview" controls playsinline></video></div><div class="timeline"><div class="track"><div id="progress"></div></div><div class="meta"><span id="duration">00:00</span><span id="time">00:00</span></div></div><div class="panel"><h3>AI Processing</h3><div id="aiLog"><span>AI</span> مستني الفيديو...</div><div class="steps"><div><b>01</b> تحليل الصوت والكلام<em>Waiting</em></div><div><b>02</b> حذف السكوت<em>Waiting</em></div><div><b>03</b> تأثيرات و Smart Zoom<em>Waiting</em></div><div><b>04</b> تصدير MP4<em>Waiting</em></div></div></div></section></main><div id="toast"></div><script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script><script src="https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/umd/index.js"></script><script src="app.js"></script></body></html>
